name: daily-digest

# 잠시 중지. 다시 켤 때는 schedule 주석을 되돌리고 job의 if를 지운다.
on:
  # schedule:
  #   # KST 07:00
  #   - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  run-digest:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger feed-briefly digest
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          curl -fsS -X POST "${API_URL}/api/internal/run-digest" \
            -H "x-internal-secret: ${INTERNAL_SECRET}"
